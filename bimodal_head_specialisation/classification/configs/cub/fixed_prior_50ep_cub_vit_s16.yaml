# Fixed locality prior on CUB-200-2011 — 50 epochs
# ABLATION: Same distance penalty as token_mild_v2, but NO learnable gate.
# If this equals token_mild_v2 → gate is useless.
# If token_mild_v2 beats this → adaptive gating adds value.
#
# fixed_strength=0.5 chosen to match the converged gate output of v1 mild (~0.66)
# but slightly less since we want a fair comparison with v2 which starts at ~0.

model_name: vit_small_patch16_224
hf_dataset: bentrevett/caltech-ucsd-birds-200-2011
output_dir: runs/cub/fixed_prior_50ep_cub_vit_s16
num_classes: 200

# Training
epochs: 50
batch_size: 384
lr: 0.00001
weight_decay: 0.05
warmup_epochs: 3
label_smoothing: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
seed: 42
num_workers: 4
grad_clip_norm: 1.0

# Fixed locality prior (no learnable gate)
reg_type: fixed_locality_prior
regularized_blocks: [0, 1, 2, 3, 4, 5]
fixed_strength: 0.5
gate_distance_scale: 2.0

# Attention analysis
tau_values: [0.15, 0.25, 0.35]
attention_eval_subset_size: 512
attention_eval_frequency_epochs: 1

# Speed
amp: true
channels_last: true
compile: false
cudnn_benchmark: true
persistent_workers: true
prefetch_factor: 4
