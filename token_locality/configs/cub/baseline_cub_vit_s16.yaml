# Baseline ViT-S/16 fine-tuning on CUB-200-2011
# No token locality — pure classification fine-tuning from ImageNet pretrained weights.

model_name: vit_small_patch16_224
hf_dataset: bentrevett/caltech-ucsd-birds-200-2011
output_dir: runs/cub/baseline_cub_vit_s16
num_classes: 200

# Training
epochs: 20
batch_size: 256
lr: 0.00001
weight_decay: 0.05
warmup_epochs: 2
label_smoothing: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
seed: 42
num_workers: 4
grad_clip_norm: 1.0

# No regularization
reg_type: none
lambda_reg: 0.0

# Attention analysis
tau_values: [0.15, 0.25, 0.35]
attention_eval_subset_size: 512
attention_eval_frequency_epochs: 1

# Speed
amp: true
channels_last: true
compile: false
cudnn_benchmark: true
persistent_workers: true
prefetch_factor: 4
