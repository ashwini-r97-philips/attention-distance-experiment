# Token locality v3 on CUB-200-2011 — 50 epochs
# Per-head, signed (tanh) gate: each head independently learns local or global bias.
# gate_scale=2.0  → gate values in (-2, +2); positive=local, negative=global
# Starts at zero (tanh(0)=0), so model begins as unmodified baseline.

model_name: vit_small_patch16_224
hf_dataset: bentrevett/caltech-ucsd-birds-200-2011
output_dir: runs/cub/token_v3_50ep_cub_vit_s16
num_classes: 200

# Training
epochs: 50
batch_size: 384
lr: 0.00001
weight_decay: 0.05
warmup_epochs: 3
label_smoothing: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
seed: 42
num_workers: 4
grad_clip_norm: 1.0

# Token locality gate v3 (per-head, signed)
reg_type: token_locality_v3
regularized_blocks: [0, 1, 2, 3, 4, 5]
gate_distance_scale: 2.0   # multiplier on the penalty before softmax
gate_scale: 2.0            # tanh ceiling: gate values in (-gate_scale, +gate_scale)
gate_weight_std: 0.02
gate_lr_multiplier: 10.0   # gate params trained at 10× backbone LR

# Attention analysis
tau_values: [0.15, 0.25, 0.35]
attention_eval_subset_size: 512
attention_eval_frequency_epochs: 1

# Speed
amp: true
channels_last: true
compile: false
cudnn_benchmark: true
persistent_workers: true
prefetch_factor: 4
