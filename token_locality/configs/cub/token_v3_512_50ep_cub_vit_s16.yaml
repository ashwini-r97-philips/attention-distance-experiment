model_name: vit_small_patch16_224
hf_dataset: bentrevett/caltech-ucsd-birds-200-2011
output_dir: runs/cub/token_v3_512_50ep_cub_vit_s16
num_classes: 200
img_size: 512

epochs: 50
batch_size: 384
fixed_batch_size: 16
lr: 0.00001
weight_decay: 0.05
warmup_epochs: 3
label_smoothing: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
seed: 42
num_workers: 4
grad_clip_norm: 1.0

reg_type: token_locality_v3
regularized_blocks: [0, 1, 2, 3, 4, 5, 8, 9, 10, 11]
gate_distance_scale: 2.0
gate_scale: 2.0
gate_weight_std: 0.02
gate_lr_multiplier: 10.0

tau_values: [0.15, 0.25, 0.35]
attention_eval_subset_size: 512
attention_eval_frequency_epochs: 1

amp: true
channels_last: true
compile: false
cudnn_benchmark: true
persistent_workers: true
prefetch_factor: 4
